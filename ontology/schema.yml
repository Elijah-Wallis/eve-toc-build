version: 1
authority:
  title: Eve Ontology SSOT
  constitution: README.md
  owner: Eve Ontology
core_invariants:
  - "Every durable operational fact maps to a declared ontology object."
  - "Every canonical record preserves provenance."
  - "No workflow or script may create shadow entities outside the ontology."
  - "Agent self-improvement is proposal-only and human-governed."
  - "Runtime and schema must conform to the ontology SSOT."
domain_objects:
  - name: PatientJourney
    description: Canonical longitudinal record of patient demand, conversion, treatment, follow-up, and retention.
    provenance:
      required:
        - source_system
        - source_record_id
        - observed_at
        - ingested_at
  - name: ClinicalEncounter
    description: A concrete patient interaction such as consultation, treatment visit, hygiene visit, surgery, or post-op follow-up.
    provenance:
      required:
        - source_system
        - source_record_id
        - observed_at
        - recorded_by
  - name: "AestheticProcedure/DentalService"
    description: The service or procedure delivered or recommended during a clinical or commercial workflow.
    provenance:
      required:
        - source_system
        - service_code
        - observed_at
  - name: Provider
    description: Licensed or operational staff member responsible for delivery, consultation, supervision, or documentation.
    provenance:
      required:
        - source_system
        - provider_identifier
        - observed_at
  - name: ClinicLocation
    description: Physical or licensed operating location where care, scheduling, sales, or inventory events occur.
    provenance:
      required:
        - source_system
        - location_identifier
        - observed_at
  - name: ConsumableInventory
    description: Traceable stock position for injectables, implants, disposables, dental materials, and related consumables.
    provenance:
      required:
        - source_system
        - sku_or_lot
        - observed_at
  - name: FinancialEvent
    description: Revenue, payment, refund, write-off, payroll, supply cost, or other value movement tied to the operating model.
    provenance:
      required:
        - source_system
        - transaction_id
        - observed_at
  - name: ComplianceRecord
    description: Canonical evidence of consent, credentialing, policy attestation, audit trail, privacy handling, or regulatory control.
    provenance:
      required:
        - source_system
        - evidence_id
        - observed_at
relationships:
  - from: PatientJourney
    to: ClinicalEncounter
    type: has_many
  - from: ClinicalEncounter
    to: "AestheticProcedure/DentalService"
    type: delivers_or_recommends
  - from: ClinicalEncounter
    to: Provider
    type: performed_by
  - from: ClinicalEncounter
    to: ClinicLocation
    type: occurs_at
  - from: "AestheticProcedure/DentalService"
    to: ConsumableInventory
    type: consumes
  - from: PatientJourney
    to: FinancialEvent
    type: generates
  - from: PatientJourney
    to: ComplianceRecord
    type: governed_by
  - from: Provider
    to: ComplianceRecord
    type: constrained_by
  - from: ClinicLocation
    to: ConsumableInventory
    type: stores
provenance:
  canonical_fields:
    - source_system
    - source_record_id
    - observed_at
    - ingested_at
    - recorded_by
    - evidence_uri
    - lineage_hash
  rules:
    - "Canonical records must preserve upstream identifiers."
    - "Derived records must point back to source evidence."
    - "Cross-object joins must be explainable from stored provenance."
operations:
  PatientJourney:
    create: upsert_patient_journey
    read:
      - get_patient_journey
      - list_patient_journeys
    update:
      - patch_patient_journey
      - patch_patient_journeys
    events:
      - upsert_patient_journey_event
      - list_recent_patient_journey_events
  ClinicalEncounter:
    create: upsert_clinical_encounter
    read:
      - get_clinical_encounter
      - list_clinical_encounters
    update:
      - patch_clinical_encounter
    transcripts:
      - upsert_clinical_transcript
      - replace_clinical_transcript_turns
  "AestheticProcedure/DentalService":
    create: upsert_patient_journey_segment
    read:
      - query_object
  Provider:
    create: upsert_provider
    read:
      - get_provider
  ClinicLocation:
    create: upsert_clinic_location
    read:
      - get_clinic_location
  ConsumableInventory:
    create: upsert_consumable_inventory
    read:
      - query_object
  FinancialEvent:
    create: upsert_patient_journey_event
    read:
      - get_financial_event
      - list_recent_patient_journey_events
  ComplianceRecord:
    create: upsert_compliance_record
    read:
      - list_compliance_phones
      - query_object
relationship_examples:
  - object: PatientJourney
    example: "PatientJourney[id=lead-123] has_many ClinicalEncounter[id=call-456]"
  - object: ClinicalEncounter
    example: "ClinicalEncounter[id=call-456] delivers_or_recommends AestheticProcedure/DentalService[id=segment-789]"
  - object: Provider
    example: "Provider[id=prov-22] constrained_by ComplianceRecord[id=license-ny-2026]"
  - object: ClinicLocation
    example: "ClinicLocation[id=clinic-dallas] stores ConsumableInventory[id=lot-btx-2026-02]"
