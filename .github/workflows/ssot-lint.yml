name: ssot-lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SSOT constitution lint
        run: |
          python3 scripts/ci/lint_ssot_invariants.py
      - name: Enforce SSOT framing in PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, sys
          body = (os.environ.get("PR_BODY") or "")
          required = "How does this PR strengthen the SSOT for data fragmentation?"
          if required not in body:
              print(f"[SSOT-LINT] missing required PR framing: {required}")
              sys.exit(1)
          print("[SSOT-LINT] PR framing requirement satisfied")
          PY
