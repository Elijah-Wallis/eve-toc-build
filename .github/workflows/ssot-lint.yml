name: ssot-lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  ssot-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce README Constitution, ontology schema, and PR template
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          grep -Fqx '# Eve Ontology — Single Source of Truth (SSOT) Constitution' README.md
          for heading in \
            '## Core Mission' \
            '## What Eve Is (Not Just Code)' \
            '## Core Invariants (Never Break These — Enforced in CI/CD and PR Templates)' \
            '## Domain Objects (Core of the Ontology — Expand in /ontology/ directory)' \
            '## Repo Philosophy & Enforcement'
          do
            grep -Fq "$heading" README.md
          done
          grep -Fq 'Highest Leverage Problem We Solve First and Forever' README.md
          grep -Fq 'Protect the SSOT. Everything else compounds from here.' README.md

          test -f ontology/schema.yml
          test ! -f ontology/schema.sql
          test ! -f ontology/schema.json
          for object_name in \
            'PatientJourney' \
            'ClinicalEncounter' \
            'AestheticProcedure/DentalService' \
            'Provider' \
            'ClinicLocation' \
            'ConsumableInventory' \
            'FinancialEvent' \
            'ComplianceRecord'
          do
            grep -Fq "${object_name}" ontology/schema.yml
          done
          grep -Fq 'relationships:' ontology/schema.yml
          grep -Fq 'provenance:' ontology/schema.yml

          test -f CONTRIBUTING.md
          grep -Fq 'README.md' CONTRIBUTING.md
          grep -Fq 'Ontology SSOT' CONTRIBUTING.md

          test -f .github/PULL_REQUEST_TEMPLATE.md
          grep -Fq 'Constitution reference:' .github/PULL_REQUEST_TEMPLATE.md
          grep -Fq 'How does this PR strengthen the SSOT for data fragmentation?' .github/PULL_REQUEST_TEMPLATE.md
          grep -Fq 'Does this PR protect the Ontology SSOT? (Y/N + link)' .github/PULL_REQUEST_TEMPLATE.md

          ! grep -Fq 'choices=["off", "propose", "apply"]' agents/voice-agent/service/scripts/self_improve_cycle.py
          ! grep -Fq 'choices=["off", "propose", "apply"]' policies/scripts/self_improve_cycle.py
          ! grep -Fq 'choices=["off", "propose", "apply"]' reviews/toc-build/scripts/self_improve_cycle.py
          ! grep -Fq 'RETELL_AUTO_LEARN_ON_CALL:-true' agents/voice-agent/service/scripts/call_b2b.sh
          ! grep -Fq 'RETELL_AUTO_LEARN_ON_CALL:-true' policies/scripts/call_b2b.sh
          ! grep -Fq 'RETELL_AUTO_LEARN_ON_CALL:-true' reviews/toc-build/scripts/call_b2b.sh
